<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- MAD web form project -->

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .form-title {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="form-title">Student Registration Form</h1>

        <form id="studentForm" onsubmit="return validateForm()">

            <!-- Inline CSS -->
            <label style="font-weight: bold;">
                Full Name <span class="required">*</span>
            </label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label>Email <span class="required">*</span></label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" placeholder="Enter 10-digit phone number">

            <label>Date of Birth <span class="required">*</span></label>
            <input type="date" id="dob">

            <label>Gender <span class="required">*</span></label>
            <select id="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Course <span class="required">*</span></label>
            <select id="course">
                <option value="">Select Course</option>
                <option>B.Sc Data Science</option>
                <option>B.Sc Computer Science</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Com</option>
            </select>

            <label>Address <span class="required">*</span></label>
            <textarea id="address" rows="4"
                placeholder="Enter your address"></textarea>

            <label>Skills <span class="required">*</span></label>
            <input type="text" id="skills"
                placeholder="Example: Python, HTML, CSS">

            <label>Upload Resume <span class="required">*</span></label>
            <input type="file" id="resume" accept=".pdf,.doc,.docx">

            <label>Password <span class="required">*</span></label>
            <input type="password" id="password"
                placeholder="Create a password">

            <button type="submit">Register</button>

        </form>

        <p id="message"></p>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
